name: authenticator_app
description: 身份验证器 - 基于TOTP标准的动态验证码应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  mobile_scanner: ^5.2.3
  provider: ^6.1.2
  intl: ^0.19.0
  crypto: ^3.0.5
  base32: ^2.1.3
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
