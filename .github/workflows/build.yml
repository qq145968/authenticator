name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Run tests
        run: flutter test

      # ===== 固定签名已内置在项目仓库中（锁死签名）=====
      - name: Verify built-in signing keystore
        run: |
          ls -la android/app/authenticator.p12 android/key.properties
          echo "✓ Built-in keystore and key.properties found (signature locked)"

      - name: Fix keystore alias (repackage with openssl to ensure alias='authenticator')
        run: |
          cd android/app
          echo "=== BEFORE: keystore aliases ==="
          keytool -list -keystore authenticator.p12 -storepass authenticator_2024_fixed -storetype PKCS12 2>&1 || true
          echo "=== Repackaging p12 with explicit alias 'authenticator' ==="
          openssl pkcs12 -in authenticator.p12 -nocerts -nodes -passin pass:authenticator_2024_fixed -out key.pem
          openssl pkcs12 -in authenticator.p12 -nokeys -passin pass:authenticator_2024_fixed -out cert.pem
          openssl pkcs12 -export \
            -in cert.pem \
            -inkey key.pem \
            -out authenticator_fixed.p12 \
            -name authenticator \
            -passout pass:authenticator_2024_fixed
          mv authenticator_fixed.p12 authenticator.p12
          rm -f key.pem cert.pem
          echo "=== AFTER: keystore aliases ==="
          keytool -list -keystore authenticator.p12 -storepass authenticator_2024_fixed -storetype PKCS12
          echo "✓ Keystore alias fixed to 'authenticator'"

      - name: Build APK (universal, all ABIs in one package)
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authenticator-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: authenticator-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
